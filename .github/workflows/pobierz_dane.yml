name: Pobierz projekty NASA

on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Przełącz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: pip install requests

      - name: Uruchomienie skryptu
        run: python pobierz.py

      - name: Automatyczny zapis pliku do repozytorium
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatyczna aktualizacja listy projektów NASA"
          file_pattern: nasa_projects.json
